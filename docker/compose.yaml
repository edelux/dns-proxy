---
services:
  dns-proxy:
    image: edelux/dns-proxy:latest
    container_name: dns-proxy
    pull_policy: missing

    environment:
      GOMAXPROCS: '1'
      GOMEMLIMIT: '40MiB'

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true

    cpus: 0.05
    mem_limit: 48m
    mem_reservation: 24m
    memswap_limit: 48m
    pids_limit: 24

    tmpfs:
      - /run:size=1m,mode=0755
      - /tmp:size=1m,mode=1777
      - /var/run:size=1m,mode=0755
      - /var/log/dnscrypt-proxy:size=6m,uid=65534,gid=65534,mode=0750
      - /var/cache/dnscrypt-proxy:size=8m,uid=65534,gid=65534,mode=0750

    networks:
      - dns-proxy
    ports:
      - '127.0.0.1:53:53/tcp'
      - '127.0.0.1:53:53/udp'

    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

    command: >
      --anonymized
      --cachesize=1024
      --server=/default/192.168.122.1
      --server=/ec2.internal/10.18.0.2
      --server=/amazonaws.com/10.18.0.2
      --server=/compute.internal/10.18.0.2
    restart: always

networks:
  dns-proxy:
    name: dns-proxy
    driver: bridge
...
